[package]
name = "blink-reminder"
version = "1.2.0"
edition = "2021"
description = "Ứng dụng nhắc nhở chớp mắt và đứng dậy cho Windows"
authors = ["Mitonios with AI"]
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
# Win32 APIs cho overlay, registry, tray, dialog
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # Direct2D & DirectWrite cho rendering với alpha transparency
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    # Idle detection
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

# Async timers
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "sync", "macros"] }

# Serialize config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# App data paths
directories = "6.0.0"

# Error handling & logging
anyhow = "1.0"
log = "0.4"
env_logger = "0.11.8"
chrono = "0.4"

# GUI framework
eframe = "0.30"
egui = "0.30"
