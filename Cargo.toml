[package]
name = "blink-reminder"
version = "0.1.0"
edition = "2021"
description = "Ứng dụng nhắc nhở chớp mắt và đứng dậy cho Windows"
authors = ["Your Name"]
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
# Win32 APIs cho overlay và registry
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

# System tray icon
tray-item = "0.10"

# GUI config window
eframe = "0.28"
egui = "0.28"

# Async timers
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "sync", "macros"] }

# Serialize config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# App data paths
directories = "5.0"

# Tray icon - sử dụng Win32 API trực tiếp

# Global state
once_cell = "1.19"

# Additional utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
